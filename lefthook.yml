# Git hooks managed by lefthook.
# Install: pnpm install (lefthook is a devDependency)
# Activate: pnpm exec lefthook install  (also runs automatically via "prepare" script)

pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks protect --staged --redact --no-banner

    # Frontend lint & format on staged files. `root:` strips that prefix from
    # {staged_files} so paths line up with the working directory.
    web-eslint:
      root: apps/web
      glob: "*.{js,ts,svelte}"
      run: pnpm exec eslint {staged_files}
    web-prettier:
      root: apps/web
      glob: "*.{js,ts,svelte,css,html,md,json}"
      run: pnpm exec prettier --check {staged_files}

    # Backend lint runs the project task — ktlint discovers files itself, so
    # we don't need to forward {staged_files}.
    api-ktlint:
      root: apps/api
      glob: "*.{kt,kts}"
      run: ./gradlew ktlintCheck --quiet

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

# Heavier checks before remote push: full typecheck + lint pass on each app.
# Tests themselves run in CI (they need postgres + redis containers).
pre-push:
  parallel: true
  commands:
    web-svelte-check:
      root: apps/web
      run: pnpm exec svelte-check --threshold error
    api-detekt:
      root: apps/api
      run: ./gradlew detekt --quiet
