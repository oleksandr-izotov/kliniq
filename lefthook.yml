# Git hooks managed by lefthook.
# Install: pnpm install (lefthook is a devDependency)
# Activate: pnpm exec lefthook install  (also runs automatically via "prepare" script)

pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks protect --staged --redact --no-banner
    # Frontend / Kotlin lint commands will be added in Sprint 0 Day 3 / Day 4
    # once the apps/web and apps/api skeletons exist.

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

# pre-push hooks for typecheck + tests will be added once apps exist.
