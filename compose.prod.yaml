# Production stack — used both for local prod-image testing and for the
# real Hetzner deploy through Coolify.
#
# Required env vars (Coolify sets them; locally export or use a `.env`):
#   PRIMARY_DOMAIN     `:80` for local plain-HTTP, `kliniq.izotov.dev`
#                      in prod (Caddy auto-provisions Let's Encrypt).
#   POSTGRES_PASSWORD  Generated random in Coolify; for local testing a
#                      sane fallback is applied.
#
# Bring up locally:
#   PRIMARY_DOMAIN=:80 docker compose -f compose.prod.yaml up --build
# Tear down:
#   docker compose -f compose.prod.yaml down
# Reset data (drops Postgres + Redis volumes + Caddy certs):
#   docker compose -f compose.prod.yaml down -v
#
# Sequence:
#   1. ./gradlew -p apps/api :bootJar  (builds the JAR locally — Docker
#                                       skips this because jOOQ codegen
#                                       needs a real Postgres at build time)
#   2. docker compose -f compose.prod.yaml up --build
#   3. Open the site on whatever PRIMARY_DOMAIN was set to.
#
# Mailpit is the SMTP sink for V1 — Resend hookup is a follow-up. Mail
# accumulates in the container until the future SPRING_MAIL_HOST swap.

name: kliniq-prod

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kliniq
      POSTGRES_USER: kliniq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kliniq_local_prod_test}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kliniq -d kliniq"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - kliniq-prod-net

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - kliniq-prod-net

  # Mailpit only for local prod-test — in real prod the API points at
  # Resend SMTP via env vars (SPRING_MAIL_HOST etc.). UI port not
  # mapped to host because dev compose typically already binds 8025
  # there. To inspect mail temporarily, add `- "8026:8025"` here.
  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    networks:
      - kliniq-prod-net

  api:
    # The API image is built and pushed by the `api-image` job in
    # `.github/workflows/ci.yml` on every merge to main. jOOQ codegen
    # needs a live Postgres at compile time, which Coolify's bare
    # `docker compose build` doesn't have — that's why we bake the JAR
    # into the image in CI and just pull + run here.
    #
    # No `build:` block: Compose interprets the presence of `build:` as
    # "always build this service", and Coolify launches its deploy as
    # `docker compose ... build --pull` which would then trip on the
    # absent build/libs/*.jar in the deploy server's checkout. With only
    # `image:`, Compose pulls the tag and skips the build entirely.
    #
    # Local prod-image testing flow (the one the file used to support):
    #   1. ./gradlew -p apps/api :bootJar
    #   2. docker build -t ghcr.io/oleksandr-izotov/kliniq-api:latest -f apps/api/Dockerfile apps/api/
    #   3. docker compose -f compose.prod.yaml up
    # The `up` finds the locally-tagged image and skips the pull, same
    # net effect as Coolify pulling from GHCR.
    image: ghcr.io/oleksandr-izotov/kliniq-api:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kliniq
      SPRING_DATASOURCE_USERNAME: kliniq
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-kliniq_local_prod_test}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      APP_WEB_BASE_URL: ${APP_WEB_BASE_URL:-http://localhost}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-no-reply@kliniq.local}
    networks:
      - kliniq-prod-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - kliniq-prod-net

  # Caddy is the public entry point for both local and prod. The site
  # address comes from $PRIMARY_DOMAIN at container start:
  #   - `PRIMARY_DOMAIN=:80` → plain HTTP (local prod-image testing)
  #   - `PRIMARY_DOMAIN=kliniq.izotov.dev` → Caddy auto-provisions a
  #     Let's Encrypt cert and forces HTTPS. Issued certs persist in the
  #     `caddy-data` volume across container restarts so we don't burn
  #     through the LE rate limit on every deploy.
  # In real prod the Coolify built-in proxy is disabled for this server
  # so 80/443 are free for Caddy to bind.
  #
  # The Caddyfile is supplied inline via Compose's `configs.content`
  # rather than as a host bind-mount. Coolify rewrites relative bind
  # paths to its own /data/coolify/applications/<uuid>/ directory and
  # expects file contents to be populated through its Storages UI;
  # `configs.content` sidesteps that entire dance — Compose materialises
  # the file ephemerally inside the container, no host file required.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PRIMARY_DOMAIN: ${PRIMARY_DOMAIN:-:80}
    depends_on:
      - api
      - web
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
        mode: 0444
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - kliniq-prod-net

volumes:
  pg-data:
  redis-data:
  caddy-data:
  caddy-config:

# Inline Caddyfile. Caddy's `{$PRIMARY_DOMAIN}` placeholder is read at
# runtime — Compose's own variable interpolation only touches `${VAR}`
# (with the dollar before the brace), so this passes through verbatim.
configs:
  caddyfile:
    content: |
      {$PRIMARY_DOMAIN} {
        # API endpoints — backend handles them all under /api/v1, plus
        # springdoc paths, plus Spring Actuator for healthchecks.
        @api {
          path /api/* /v3/api-docs* /swagger-ui* /actuator/*
        }
        reverse_proxy @api api:8080

        # Everything else — SPA + SvelteKit-rendered routes.
        reverse_proxy web:3000

        # Compress responses where it helps.
        encode gzip zstd
      }

networks:
  kliniq-prod-net:
