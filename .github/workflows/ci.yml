name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs on the same ref when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend (Kotlin + Spring Boot) — schema + codegen, lint, static analysis,
  # and Spring context tests against real Postgres and Redis. Tests use
  # Testcontainers via @ServiceConnection (so they spin up their own DB), but
  # the build-time `flywayMigrate` + `generateJooq` chain still needs a real
  # Postgres — that's what the postgres service container below provides on
  # the canonical port 5432 (overriding our local default of 55432).
  # ---------------------------------------------------------------------------
  api:
    name: api · build & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kliniq
          POSTGRES_USER: kliniq
          POSTGRES_PASSWORD: kliniq_dev_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kliniq -d kliniq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ORG_GRADLE_PROJECT_dbPort: '5432'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Codegen runs first: applies V1+V2 to the postgres service via Flyway
      # and writes Kotlin sources under build/generated-sources/jooq. Doing
      # this up-front means downstream tasks can be evaluated independently.
      - name: Generate jOOQ sources
        working-directory: apps/api
        run: ./gradlew flywayClean flywayMigrate generateJooq

      - name: Lint (ktlint)
        working-directory: apps/api
        run: ./gradlew ktlintCheck

      - name: Static analysis (detekt)
        working-directory: apps/api
        run: ./gradlew detekt

      - name: Test
        working-directory: apps/api
        run: ./gradlew test

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-reports
          path: apps/api/build/reports/tests/test

  # ---------------------------------------------------------------------------
  # API container image — builds the bootJar against the same Postgres-service
  # pattern as the test job (jOOQ codegen is non-negotiable in this stack), then
  # ships the runtime image to GHCR. Only fires on push to main; PR builds stop
  # at the test+lint matrix above. Needs `api` to be green so we don't publish
  # an image whose own tests fail.
  # ---------------------------------------------------------------------------
  api-image:
    name: api · build & push image
    needs: api
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kliniq
          POSTGRES_USER: kliniq
          POSTGRES_PASSWORD: kliniq_dev_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kliniq -d kliniq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ORG_GRADLE_PROJECT_dbPort: '5432'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # bootJar pulls in flywayMigrate → generateJooq → compileKotlin
      # transitively, so the single task is enough to produce the runnable
      # fat JAR under build/libs/.
      - name: Build bootJar
        working-directory: apps/api
        run: ./gradlew bootJar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The repo path component of the GHCR image name MUST be lowercase;
      # `github.repository` already is for our repo, but normalising here
      # protects future contributors with mixed-case usernames.
      - name: Resolve image name
        id: img
        run: |
          repo_lc="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${repo_lc}-api" >> "$GITHUB_OUTPUT"

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.image }}:latest
            ${{ steps.img.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Frontend (SvelteKit + TypeScript) — lint, typecheck, unit tests.
  # E2E (playwright) is not run in CI yet; deferred until V1 has real flows.
  # ---------------------------------------------------------------------------
  web:
    name: web · lint, typecheck, unit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup reads the version from packageManager field in
      # package.json — no need to specify it here.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint + prettier)
        working-directory: apps/web
        run: pnpm run lint

      - name: Typecheck (svelte-check)
        working-directory: apps/web
        run: pnpm run check

      - name: Unit tests (vitest)
        working-directory: apps/web
        run: pnpm exec vitest run

  # ---------------------------------------------------------------------------
  # Secrets — gitleaks scans the repo on every push and PR.
  # ---------------------------------------------------------------------------
  gitleaks:
    name: gitleaks · secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ---------------------------------------------------------------------------
  # Conventional Commits — only runs on PRs (commit messages of pushed branches
  # have already been merged historically and aren't worth re-validating).
  # ---------------------------------------------------------------------------
  commitlint:
    name: commitlint · PR commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # pnpm/action-setup reads the version from packageManager field in
      # package.json — no need to specify it here.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate commit messages
        run: |
          pnpm exec commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}"
