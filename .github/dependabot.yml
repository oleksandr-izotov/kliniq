version: 2
updates:
  # Frontend (npm via pnpm-workspace).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      svelte:
        patterns: ["@sveltejs/*", "svelte", "svelte-*"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*", "tw-*", "prettier-plugin-tailwindcss"]
      lint-and-format:
        patterns: ["eslint*", "@eslint/*", "prettier*", "typescript-eslint", "globals"]
      testing:
        patterns: ["vitest", "@vitest/*", "@playwright/*", "playwright"]
      types:
        patterns: ["@types/*"]

  # Backend (Gradle + Maven Central).
  - package-ecosystem: gradle
    directory: "/apps/api"
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # A framework major is a migration, not a bump: Spring Boot 4 moves to
    # Spring Framework 7, and the Kotlin plugins only work when every one of
    # them sits on the same version as `kotlin("jvm")`. Dependabot cannot make
    # either change coherently -- it just opens a red PR every cycle. Those
    # upgrades are done deliberately, by hand.
    ignore:
      - dependency-name: "org.springframework.boot"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "plugin.spring"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      spring:
        patterns: ["org.springframework*", "io.spring*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "kotlin*"]
      flyway:
        patterns: ["org.flywaydb*"]
      testing:
        patterns: ["org.junit*", "org.testcontainers*", "*test*"]

  # GitHub Actions used in our CI workflow.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
