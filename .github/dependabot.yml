version: 2
updates:
  # Frontend (npm via pnpm-workspace).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      svelte:
        patterns: ["@sveltejs/*", "svelte", "svelte-*"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*", "tw-*", "prettier-plugin-tailwindcss"]
      lint-and-format:
        patterns: ["eslint*", "@eslint/*", "prettier*", "typescript-eslint", "globals"]
      testing:
        patterns: ["vitest", "@vitest/*", "@playwright/*", "playwright"]
      types:
        patterns: ["@types/*"]

  # Backend (Gradle + Maven Central).
  - package-ecosystem: gradle
    directory: "/apps/api"
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # On the JVM a major is a migration, not a bump -- Spring Boot 4 moves to
    # Spring Framework 7, springdoc 3 rewrites its starters, Gradle 9 drops
    # features this build still uses. Dependabot cannot make any of those
    # coherently; left alone it opens the same red PRs every cycle until they
    # are indistinguishable from noise. Majors are reviewed and taken by hand.
    #
    # The Kotlin plugins are stricter still: `jvm` and `plugin.spring` must sit
    # on exactly the same version as each other, and Dependabot proposes them
    # one at a time, so even a minor has to be done as one deliberate change.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jvm"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "plugin.spring"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-minor"]
    groups:
      spring:
        patterns: ["org.springframework*", "io.spring*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "kotlin*"]
      flyway:
        patterns: ["org.flywaydb*"]
      testing:
        patterns: ["org.junit*", "org.testcontainers*", "*test*"]

  # GitHub Actions used in our CI workflow.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
