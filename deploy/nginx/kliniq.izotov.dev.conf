# Kliniq behind the nginx that already fronts izotov.dev on the same host.
#
# TLS uses the Cloudflare Origin certificate issued for *.izotov.dev, so this
# subdomain needs no certificate of its own and nothing to renew. Ports 80/443
# are open only to Cloudflare's ranges at the firewall, which is why the origin
# certificate is enough: nothing else can open a connection here.
#
# Install: copy to /etc/nginx/sites-available/kliniq.izotov.dev, symlink into
# sites-enabled/, then `nginx -t && systemctl reload nginx`.

# The API issues session cookies and passkey challenges; a flood against the
# auth endpoints is the thing worth slowing down before it reaches the JVM.
limit_req_zone $binary_remote_addr zone=kliniq_auth:1m rate=20r/m;

server {
    server_name kliniq.izotov.dev;

    # Same Cloudflare ranges as the main site: without set_real_ip_from,
    # real_ip_header is ignored and every visitor shares one rate-limit bucket.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    real_ip_header CF-Connecting-IP;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- API, docs and actuator go straight to the JVM ----------------------
    # SvelteKit does not proxy these: it only calls the API server-side to fill
    # locals.user. Browser-side requests must reach the backend directly, which
    # is what Caddy did in the original stack.
    location ~ ^/(api|actuator|v3/api-docs|swagger-ui) {
        include /etc/nginx/snippets/kliniq.security-headers.conf;

        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Auth endpoints: rate-limited ---------------------------------------
    location ~ ^/api/v1/auth/(login|register|password) {
        include /etc/nginx/snippets/kliniq.security-headers.conf;
        limit_req zone=kliniq_auth burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Realtime: server-sent events ---------------------------------------
    # Buffering must be off or the browser receives nothing until nginx decides
    # the buffer is full — which for a slow event stream can be minutes.
    location /api/v1/realtime {
        include /etc/nginx/snippets/kliniq.security-headers.conf;

        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    # --- Everything else: SvelteKit, which proxies /api to the JVM itself ----
    location / {
        include /etc/nginx/snippets/kliniq.security-headers.conf;

        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 60s;
    }

    listen 443 ssl http2;

    ssl_certificate     /etc/ssl/izotov.dev/origin.pem;
    ssl_certificate_key /etc/ssl/izotov.dev/origin.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:kliniq_ssl:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
}

server {
    listen 80;
    server_name kliniq.izotov.dev;
    return 301 https://kliniq.izotov.dev$request_uri;
}
