# Security headers for kliniq.izotov.dev.
#
# In its own file for the same reason as on the main site: nginx drops inherited
# add_header directives in any block that adds one of its own, so headers set
# once at server level silently never ship. Include this in every location.
#
# No Content-Security-Policy here on purpose. SvelteKit computes per-page CSP
# hashes for its own inline hydration scripts and emits them as a <meta> tag;
# a second policy at the nginx level would intersect with it (most restrictive
# wins) and block hydration.

add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
