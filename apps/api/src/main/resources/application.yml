spring:
  application:
    name: kliniq-api
  profiles:
    # If no profile is selected, default to "local" (dev). Override on prod with
    # SPRING_PROFILES_ACTIVE=prod or --spring.profiles.active=prod.
    default: local
  # We manage docker compose lifecycle ourselves (`docker compose up -d`).
  # Spring Boot's auto-managed compose support would otherwise discover
  # compose.yaml at the working dir and override our explicit datasource
  # credentials with values it derives from the running services.
  docker:
    compose:
      enabled: false
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true
    locations: classpath:db/migration

# App-specific knobs grouped under `app.*` so they're not confused with
# Spring's own config.
app:
  web:
    base-url: https://localhost:5173
  mail:
    from: "no-reply@kliniq.local"
  security:
    breach-check:
      # Reject candidate passwords that appear in HIBP's k-anonymity API.
      # See ASVS V2.1.7. Disable explicitly only when running against a
      # network-restricted environment that can't reach pwnedpasswords.com.
      enabled: true
      api-base: https://api.pwnedpasswords.com
      timeout: 3s
      user-agent: Kliniq
  webauthn:
    # Relying-party identity. rp-id MUST be a registrable suffix of every
    # origin (no scheme, no port). For dev that's "localhost". In prod
    # override via SPRING_APPLICATION_JSON or env to e.g. "kliniq.app".
    rp-id: localhost
    rp-name: Kliniq
    # Origins the browser is allowed to start a ceremony from. Each must
    # match the URL bar exactly (scheme + host + port).
    origins:
      - https://localhost:5173
    # How long the SPA has to complete a ceremony before we drop the
    # challenge from Redis. WebAuthn spec recommends ~60s for the browser
    # timeout; we keep the server-side store a touch longer for clock skew.
    challenge-ttl: 5m
    # Browser-side timeout hint baked into the options JSON. The browser
    # treats this as advisory.
    ceremony-timeout: 60s

server:
  port: 8443
  error:
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false
    git:
      enabled: false

logging:
  level:
    root: INFO
    com.kliniq: DEBUG
    org.springframework.security: INFO
