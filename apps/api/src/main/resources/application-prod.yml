# Prod profile. Every secret reads from env vars (Spring Boot's relaxed
# binding maps SPRING_DATASOURCE_URL → spring.datasource.url etc., so we
# don't need to enumerate every one here — only the things that differ
# from application-local.yml live in this file).
#
# TLS terminates at Coolify's Caddy proxy in real prod; the JVM
# listens on plain HTTP on a non-privileged port. Day 41 adds the
# JSON logback config that takes over when this profile is active.

server:
  port: 8080
  forward-headers-strategy: native
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring:
  datasource:
    hikari:
      maximum-pool-size: 20
      connection-timeout: 5000
      leak-detection-threshold: 30000
  data:
    redis:
      timeout: 3000ms
  session:
    store-type: redis
    timeout: 30d
    redis:
      namespace: "kliniq:session"
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
      # Probes resolve at /actuator/health/liveness and
      # /actuator/health/readiness so Coolify (and any future k8s
      # upgrade) can wire dedicated probes without a custom
      # controller.
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    # Mail delivery in prod runs through ResendApiEmailSender over HTTPS
    # (Hetzner blocks outbound SMTP). Spring Boot's MailHealthIndicator
    # still tries to TCP-connect to whatever SPRING_MAIL_HOST points at
    # and hangs ~130s per check on a blocked port — useless noise in
    # the actuator output. Disable it entirely; Resend's own delivery
    # logs are the source of truth for mail health in real prod.
    mail:
      enabled: false

# Logback config lives in src/main/resources/logback-spring.xml — the
# prod springProfile block there switches to JSON-per-line on stdout.
logging:
  level:
    root: INFO
    org.springframework.web: WARN
    org.flywaydb: INFO
