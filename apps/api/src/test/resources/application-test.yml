# Test profile — minimal config for CI and local `./gradlew test`.
# Uses canonical postgres/redis ports (no host conflict in CI containers),
# disables HTTPS, and binds to a random server port.

server:
  port: 0
  ssl:
    enabled: false

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/kliniq
    username: kliniq
    password: kliniq_dev_only
    hikari:
      maximum-pool-size: 4
      connection-timeout: 5000
  data:
    redis:
      host: localhost
      port: 6379
  session:
    store-type: redis
    timeout: 30m
    redis:
      namespace: "kliniq:session:test"
  # JavaMailSender auto-config needs a host to register the bean. The actual
  # sending is intercepted by @MockitoBean(EmailSender::class) in tests, so
  # this address is never contacted.
  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

# Override app.webauthn so WebAuthnProperties has values to bind. The
# integration tests use Origin.create(...) against these origins, so any
# value the production code accepts works — http://localhost is the
# clearest "this is just a test fixture" choice.
app:
  webauthn:
    rp-id: localhost
    rp-name: Kliniq-Test
    origins:
      - http://localhost
    challenge-ttl: 5m
    ceremony-timeout: 60s

logging:
  level:
    org.flywaydb: WARN
    org.springframework.web: WARN
