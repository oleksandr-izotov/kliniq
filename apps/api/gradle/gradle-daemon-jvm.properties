# Pin the Gradle daemon's JVM regardless of the developer's JAVA_HOME. The
# build's source/target is Java 21 (see build.gradle.kts toolchain), but the
# daemon JVM also matters: Gradle 8.14's embedded Kotlin DSL compiler can't
# parse Java 25's version string ("IllegalArgumentException: 25.0.1"), which
# breaks the build for anyone running with JAVA_HOME=JDK-25.
#
# Combined with the foojay-resolver-convention plugin in settings.gradle.kts,
# Gradle auto-downloads a matching JDK if none is installed locally.
toolchainVersion=21
